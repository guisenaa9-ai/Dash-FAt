# Plano gratuito: sem disco persistente. Com DATABASE_URL (Postgres do Neon), o banco
# é restaurado ao iniciar e copiado a cada alteração; sem ela, os dados somem quando o
# serviço reinicia, hiberna (15 min sem acesso) ou recebe deploy. Ver RENDER.md.
services:
  - type: web
    name: dashboard-faturamento
    runtime: node
    branch: main
    plan: free
    autoDeploy: false
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: DASHBOARD_COOKIE_SECURE
        value: "1"
      # Preenchidos no painel do Render ao criar o Blueprint; nunca no GitHub.
      - key: DASHBOARD_ADMIN_USER
        sync: false
      - key: DASHBOARD_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
