# Plano gratuito: sem disco persistente. O banco fica no disco temporário e é
# apagado quando o serviço reinicia, hiberna (15 min sem acesso) ou recebe deploy.
# Para manter os dados, use plan: starter com o bloco disk (ver RENDER.md).
services:
  - type: web
    name: dashboard-faturamento
    runtime: node
    branch: main
    plan: free
    autoDeploy: false
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: DASHBOARD_COOKIE_SECURE
        value: "1"
      # Preenchidos no painel do Render ao criar o Blueprint; nunca no GitHub.
      - key: DASHBOARD_ADMIN_USER
        sync: false
      - key: DASHBOARD_ADMIN_PASSWORD
        sync: false
